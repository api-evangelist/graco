meters:
  - name: api_requests
    description: API request volume (presumed operational metric, not directly billed)
    unit: request
    aggregation: sum
    dimensions:
      - partner
      - environment
principles:
  - name: Visibility
    description: Until Graco exposes usage telemetry, partners should self-instrument calls to
      api.graco.com to track consumption.
  - name: Allocation
    description: Tag integration code with partner / division so any future Graco invoice can be
      mapped back to consuming business units.
  - name: Optimization
    description: Cache catalog / static data; avoid polling; batch operations when the API supports
      it.
  - name: Accountability
    description: Designate a partner / commercial owner inside the consumer org responsible for the
      Graco contract and any volume escalations.
