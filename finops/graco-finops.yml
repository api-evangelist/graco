description: 'FOCUS-aligned FinOps for Graco Inc: no public API price book is published. Cost shape
  is presumed to be a contract-level partner fee plus underlying product / service revenue, not a
  metered API line item. This document is a placeholder pending direct reconciliation with Graco.'
notes: No public pricing or billing documentation for Graco APIs. Reconcile when a developer portal
  with pricing is published.
