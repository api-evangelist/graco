specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Graco Inc
providerId: graco
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Fluid Handling
  - Manufacturing
  - Industrial
description: Graco does not publish rate-limit documentation for the Graco Inc API on its public web
  presence. Limits are presumed to be set per-contract for partner integrations. Treat values below as
  conservative placeholders pending direct confirmation from Graco.
notes: No public rate-limit documentation found at https://developer.graco.com or www.graco.com (403
  to automated fetch). Reconcile against partner agreement when available.
sources:
  - https://www.graco.com
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Partner API
    scope: contract
    metric: varies
    limit: 'see partner contract'
    notes: No public numeric limit; defined in commercial agreement.
policies:
  - name: Backoff Strategy
    description: Clients should implement exponential backoff with jitter on any 429 / 503 response
      and respect Retry-After if returned.
  - name: Contractual scoping
    description: Limits are presumed enforced per partner / customer contract rather than per public
      tier.
maintainers:
